<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peluang Puncak Himalaya</title>
<meta name="description" content="" data-tm="html.deskripsi">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="teks.js" defer></script>
<script src="util.js" defer></script>
<script src="gunung.js" defer></script>
<script src="grafik.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="container bar__in">
    <a class="wordmark" href="#prediksi"><svg class="logo" viewBox="0 0 26 20" aria-hidden="true"><path d="M1 18 L9 4 L13 11 L16 7 L25 18 Z" class="logo__p"/></svg><span data-t="html.merek">Puncak Himalaya</span></a>
    <div class="bar__kanan">
      <nav data-ta="html.navLabel" aria-label="Halaman">
        <a href="#prediksi" data-tab="prediksi" data-t="html.tab.prediksi">Prediksi</a>
        <a href="#model" data-tab="model" data-t="html.tab.model">Kartu model</a>
      </nav>
      <div class="bhs" role="group" data-ta="html.bahasaLabel" aria-label="Bahasa">
        <button type="button" data-bhs="id" lang="id" aria-pressed="true"><span class="bhs__penuh">Indonesia</span><span class="bhs__singkat" aria-hidden="true">ID</span></button>
        <button type="button" data-bhs="en" lang="en" aria-pressed="false"><span class="bhs__penuh">English</span><span class="bhs__singkat" aria-hidden="true">EN</span></button>
      </div>
    </div>
  </div>
</header>

<noscript><p class="container note">Halaman ini memerlukan JavaScript untuk menghitung prediksi dan menggambar grafik. This page needs JavaScript to calculate predictions and draw the charts.</p></noscript>

<main class="container">
  <section id="prediksi" class="view" aria-labelledby="h-prediksi">
    <div class="hero">
      <div class="hero__foto">
        <img class="foto foto--a on" src="foto/umum.jpg" alt="" width="1920" height="1352" fetchpriority="high">
        <img class="foto foto--b" src="foto/umum.jpg" alt="" width="1920" height="1352">
      </div>
      <svg id="salju" class="hero__salju" aria-hidden="true" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="hero__txt">
        <h1 id="h-prediksi" data-t="html.hero.judul"></h1>
        <p class="lead" data-t="html.hero.pengantar"></p>
      </div>
      <div class="hero__ukur">
        <svg id="gunung" viewBox="0 0 170 400" role="img" data-ta="html.hero.alat"></svg>
      </div>
      <p class="hero__ket" id="foto-ket"></p>
    </div>

    <div class="split">
      <form id="form" class="block" autocomplete="off" novalidate>
        <div class="cell cell--wide">
          <label for="peak_id" data-t="html.form.puncak"></label>
          <select id="peak_id" name="peak_id" required></select>
        </div>
        <div class="cell cell--wide seg" role="group" aria-labelledby="l-musim">
          <span class="lbl" id="l-musim" data-t="html.form.musim"></span>
          <span id="musim"></span>
        </div>
        <div class="cell">
          <label for="age" data-t="html.form.usia"></label>
          <input id="age" name="age" type="number" inputmode="numeric" min="10" max="90" value="35" required>
          <input type="range" class="slider" data-untuk="age" data-label="html.form.usia" min="10" max="90" value="35">
        </div>
        <div class="cell seg" role="group" aria-labelledby="l-sex">
          <span class="lbl" id="l-sex" data-t="html.form.kelamin"></span>
          <input type="radio" name="sex" id="sex-M" value="M" checked><label for="sex-M" data-t="html.form.laki"></label>
          <input type="radio" name="sex" id="sex-F" value="F"><label for="sex-F" data-t="html.form.perempuan"></label>
        </div>
        <div class="cell">
          <label for="citizenship" data-t="html.form.negara"></label>
          <select id="citizenship" name="citizenship" required></select>
        </div>
        <div class="cell">
          <label for="role" data-t="html.form.peran"></label>
          <select id="role" name="role" required></select>
        </div>
        <div class="cell">
          <label for="team_size" data-t="html.form.tim"></label>
          <input id="team_size" name="team_size" type="number" inputmode="numeric" min="1" max="99" value="9" required>
          <input type="range" class="slider" data-untuk="team_size" data-label="html.form.tim" min="1" max="99" value="9">
        </div>
        <div class="cell">
          <label for="hired_staff" data-t="html.form.staf"></label>
          <input id="hired_staff" name="hired_staff" type="number" inputmode="numeric" min="0" max="99" value="3" required>
          <input type="range" class="slider" data-untuk="hired_staff" data-label="html.form.staf" min="0" max="99" value="3">
        </div>
        <div class="cell cell--wide checks">
          <label class="check"><input type="checkbox" name="oxygen" checked> <span data-t="html.form.oksigen"></span></label>
          <label class="check"><input type="checkbox" name="hired"> <span data-t="html.form.staf_saya"></span></label>
          <label class="check"><input type="checkbox" name="solo"> <span data-t="html.form.solo"></span></label>
        </div>
        <p class="cell cell--wide fine" data-t="html.form.catatan"></p>
      </form>

      <section class="hasil" aria-live="polite" aria-labelledby="h-hasil">
        <h2 id="h-hasil" data-t="html.hasil.judul"></h2>
        <div id="hasil" data-state="memuat">
          <div class="skel" aria-hidden="true"></div>
          <p class="state state--memuat" data-t="html.hasil.memuat"></p>
          <div class="state state--galat" role="alert">
            <p id="galat-teks"></p>
            <button class="btn btn--quiet" type="button" id="ulangi" data-t="html.hasil.ulangi"></button>
          </div>
          <div class="state state--isi">
            <p class="angka"><span id="persen" class="figure">0</span><span class="satuan">%</span></p>
            <p id="kalimat" class="lead"></p>
            <ul id="peringatan" class="peringatan"></ul>
            <figure class="fig">
              <svg id="dim" role="img" data-ta="html.hasil.skala"></svg>
              <figcaption class="fine" data-t="html.hasil.keterangan"></figcaption>
            </figure>
            <h3 data-t="html.hasil.skenario"></h3>
            <p class="fine" data-t="html.hasil.skenarioPengantar"></p>
            <table class="register">
              <thead><tr><th scope="col" data-t="html.hasil.kepala.skenario"></th><th scope="col" class="num" data-t="html.hasil.kepala.peluang"></th><th scope="col" class="num" data-t="html.hasil.kepala.selisih"></th></tr></thead>
              <tbody id="skenario"></tbody>
            </table>
            <p class="fine" data-t="html.hasil.catatan"></p>
          </div>
        </div>
      </section>
    </div>
  </section>

  <section id="model" class="view" aria-labelledby="h-model">
    <div class="hero hero--model">
      <div class="hero__foto">
        <img class="foto on" src="foto/lhot.jpg" alt="" data-talt="gunung.foto.lhot" width="1920" height="1280">
      </div>
      <svg id="salju-model" class="hero__salju" aria-hidden="true" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="hero__txt">
        <h1 id="h-model" data-t="html.model.judul"></h1>
        <p class="lead" id="pengantar-model"></p>
      </div>
    </div>
    <p class="lead lead--model" id="ringkas-model"></p>

    <div class="stats" id="stats"></div>

    <div class="grid2">
      <section aria-labelledby="h-banding">
        <h2 id="h-banding" data-t="html.model.banding"></h2>
        <table class="register" id="banding"></table>
        <p class="fine" data-t="html.model.bandingCatatan"></p>
      </section>
      <section aria-labelledby="h-kalibrasi">
        <h2 id="h-kalibrasi" data-t="html.model.kalibrasi"></h2>
        <figure class="fig"><svg id="kalibrasi" role="img" data-ta="html.model.kalibrasiAlat"></svg></figure>
        <p class="fine" id="kalibrasi-teks"></p>
      </section>
    </div>

    <section aria-labelledby="h-geser">
      <h2 id="h-geser" data-t="html.model.geser"></h2>
      <figure class="fig"><svg id="geser" role="img" data-ta="html.model.geserAlat"></svg></figure>
      <p class="fine" id="geser-teks"></p>
      <table class="register" id="tahun-uji"></table>
    </section>

    <figure class="band">
      <img class="band__img" src="foto/maka.jpg" alt="" data-talt="gunung.foto.maka" width="1920" height="1440" loading="lazy">
      <figcaption class="band__ket" data-t="gunung.foto.maka"></figcaption>
    </figure>

    <div class="grid2">
      <section aria-labelledby="h-penting">
        <h2 id="h-penting" data-t="html.model.penting"></h2>
        <figure class="fig"><svg id="penting" role="img" data-ta="html.model.pentingAlat"></svg></figure>
        <p class="fine" data-t="html.model.pentingCatatan"></p>
      </section>
      <section aria-labelledby="h-kelompok">
        <h2 id="h-kelompok" data-t="html.model.kelompok"></h2>
        <table class="register" id="kelompok"></table>
        <p class="fine" data-t="html.model.kelompokCatatan"></p>
      </section>
    </div>

    <section aria-labelledby="h-batas" class="batas">
      <h2 id="h-batas" data-t="html.model.batas"></h2>
      <ul>
        <li id="bt-oksigen"></li>
        <li data-t="html.model.batasan.0"></li>
        <li data-t="html.model.batasan.1"></li>
        <li data-t="html.model.batasan.2"></li>
        <li data-t="html.model.batasan.3"></li>
        <li data-t="html.model.batasan.4"></li>
        <li data-t="html.model.batasan.5"></li>
      </ul>
    </section>
  </section>
</main>

<footer class="container foot">
  <p class="fine" data-t="html.kaki.data"></p>
  <p class="fine"><span data-t="html.kaki.foto"></span> <a href="https://commons.wikimedia.org/wiki/File:Everest,_Nuptse,_Khumbu_Glacier,_Nepal,_Himalayas.jpg">Everest, Vyacheslav Argenberg</a> (CC BY 4.0), <a href="https://commons.wikimedia.org/wiki/File:Kala_Patthar-38-Everest-Lhotse-Nuptse-2007-gje.jpg">Lhotse, Gerd Eichmann</a> (CC BY-SA 4.0), <a href="https://commons.wikimedia.org/wiki/File:Ama_Dablam,_Nepal.jpg">Ama Dablam, Vyacheslav Argenberg</a> (CC BY 4.0), <a href="https://commons.wikimedia.org/wiki/File:Cho_Oyu_-_North_face.jpg">Cho Oyu, Steve Hicks</a> (CC BY 2.0), <a href="https://commons.wikimedia.org/wiki/File:Makalu_and_Chamlang.jpg">Makalu, Craig Taylor</a> (CC BY-SA 2.0), <a href="https://commons.wikimedia.org/wiki/File:Pumori,_Nepal,_Asia.jpg">Pumori, Vyacheslav Argenberg</a> (CC BY 4.0). <span data-t="html.kaki.sumber"></span></p>
</footer>
</body>
</html>
